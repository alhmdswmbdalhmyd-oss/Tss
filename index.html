<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>منصة التصويت</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  background:#080b18;
  color:#fff;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,11,24,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
  width:min(1150px,94%);
  margin:auto;
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:0 0 25px rgba(124,58,237,.35);
  font-size:22px;
}

.status{
  padding:9px 14px;
  border-radius:30px;
  background:rgba(34,197,94,.1);
  border:1px solid rgba(34,197,94,.3);
  color:#4ade80;
  font-size:13px;
}

.hero{
  width:min(1150px,94%);
  margin:45px auto 25px;
  padding:55px 25px;
  text-align:center;
  border-radius:30px;
  background:
    radial-gradient(circle at 20% 20%,rgba(124,58,237,.28),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(6,182,212,.2),transparent 35%),
    #10152b;
  border:1px solid rgba(255,255,255,.08);
}

.hero h1{
  font-size:clamp(30px,6vw,58px);
  margin-bottom:15px;
}

.hero h1 span{
  background:linear-gradient(90deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#aab2c8;
  font-size:16px;
  line-height:1.9;
  max-width:650px;
  margin:auto;
}

.section{
  width:min(1150px,94%);
  margin:35px auto 70px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

.section-title h2{
  font-size:25px;
}

.section-title p{
  color:#8d96ad;
  font-size:13px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
  background:#11172c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  padding:18px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(34,211,238,.35);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.person-image{
  width:100%;
  height:220px;
  border-radius:19px;
  overflow:hidden;
  background:#1b223c;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}

.person-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-image{
  font-size:55px;
  color:#66708c;
}

.card h3{
  font-size:21px;
  margin-bottom:7px;
}

.card p{
  color:#8f99b2;
  font-size:13px;
  line-height:1.7;
  min-height:45px;
  margin-bottom:16px;
}

.vote-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#7c3aed,#06b6d4);
  transition:.2s;
}

.vote-btn:hover{
  transform:scale(1.02);
}

.vote-btn:disabled{
  cursor:not-allowed;
  opacity:.45;
  transform:none;
}

.empty{
  text-align:center;
  padding:60px 20px;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:25px;
  color:#8d96ad;
}

.notice{
  display:none;
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  background:#151c35;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  padding:14px 20px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  min-width:260px;
  text-align:center;
}

footer{
  text-align:center;
  padding:25px;
  color:#606a83;
  font-size:12px;
}

@media(max-width:600px){
  .header-inner{
    min-height:65px;
  }

  .logo{
    font-size:16px;
  }

  .logo-icon{
    width:39px;
    height:39px;
  }

  .hero{
    margin-top:25px;
    padding:40px 18px;
    border-radius:23px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .person-image{
    height:240px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">✓</div>
      <span>منصة التصويت</span>
    </div>

    <div id="status" class="status">جاري التحميل...</div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>صوّت لمن <span>تراه مناسبًا</span></h1>
    <p>
      اختر الشخص الذي ترغب في التصويت له واضغط على زر التصويت.
      يمكنك التصويت مرة واحدة فقط من هذا الجهاز.
    </p>
  </section>

  <section class="section">
    <div class="section-title">
      <h2>المرشحون</h2>
      <p id="candidateCount">0 مرشح</p>
    </div>

    <div id="cards" class="cards"></div>
  </section>

</main>

<div id="notice" class="notice"></div>

<footer>
  جميع الحقوق محفوظة © منصة التصويت
</footer>

<script>
const CANDIDATES_KEY = "candidates";
const VOTES_KEY = "votes";
const SETTINGS_KEY = "voteSettings";
const VOTED_KEY = "votedCandidate";

function getCandidates(){
  try{
    return JSON.parse(localStorage.getItem(CANDIDATES_KEY)) || [];
  }catch(e){
    return [];
  }
}

function getVotes(){
  try{
    return JSON.parse(localStorage.getItem(VOTES_KEY)) || {};
  }catch(e){
    return {};
  }
}

function getSettings(){
  try{
    return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {
      open:true,
      start:"",
      end:""
    };
  }catch(e){
    return {
      open:true,
      start:"",
      end:""
    };
  }
}

function isVotingOpen(){
  const settings=getSettings();

  if(settings.open===false) return false;

  const now=new Date();

  if(settings.start){
    const start=new Date(settings.start);
    if(now<start) return false;
  }

  if(settings.end){
    const end=new Date(settings.end);
    if(now>end) return false;
  }

  return true;
}

function showNotice(message){
  const notice=document.getElementById("notice");
  notice.textContent=message;
  notice.style.display="block";

  clearTimeout(window.noticeTimer);

  window.noticeTimer=setTimeout(()=>{
    notice.style.display="none";
  },3000);
}

function vote(id){
  if(!isVotingOpen()){
    showNotice("التصويت مغلق حاليًا.");
    return;
  }

  const alreadyVoted=localStorage.getItem(VOTED_KEY);

  if(alreadyVoted){
    showNotice("لقد قمت بالتصويت مسبقًا من هذا الجهاز.");
    return;
  }

  const candidates=getCandidates();
  const candidate=candidates.find(c=>String(c.id)===String(id));

  if(!candidate){
    showNotice("هذا المرشح غير موجود.");
    return;
  }

  const votes=getVotes();

  votes[id]=Number(votes[id]||0)+1;

  localStorage.setItem(VOTES_KEY,JSON.stringify(votes));
  localStorage.setItem(VOTED_KEY,String(id));

  showNotice("تم تسجيل تصويتك بنجاح ✓");

  render();
}

function render(){
  const cards=document.getElementById("cards");
  const count=document.getElementById("candidateCount");
  const status=document.getElementById("status");

  const candidates=getCandidates();
  const voted=localStorage.getItem(VOTED_KEY);
  const open=isVotingOpen();

  count.textContent=`${candidates.length} مرشح`;

  if(open){
    status.textContent="التصويت مفتوح";
    status.style.color="#4ade80";
    status.style.borderColor="rgba(34,197,94,.3)";
    status.style.background="rgba(34,197,94,.1)";
  }else{
    status.textContent="التصويت مغلق";
    status.style.color="#fb7185";
    status.style.borderColor="rgba(244,63,94,.3)";
    status.style.background="rgba(244,63,94,.1)";
  }

  if(candidates.length===0){
    cards.innerHTML=`
      <div class="empty">
        لا يوجد مرشحون حاليًا.
      </div>
    `;
    return;
  }

  cards.innerHTML=candidates.map(candidate=>{

    const image=candidate.image
      ? `<img src="${candidate.image}" alt="${escapeHTML(candidate.name)}">`
      : `<div class="no-image">👤</div>`;

    const disabled=!open || voted;

    return`
      <article class="card">
        <div class="person-image">
          ${image}
        </div>

        <h3>${escapeHTML(candidate.name||"بدون اسم")}</h3>

        <p>
          ${escapeHTML(candidate.description||"مرشح في منصة التصويت")}
        </p>

        <button
          class="vote-btn"
          onclick="vote('${String(candidate.id).replace(/'/g,"\\'")}')"
          ${disabled?"disabled":""}
        >
          ${voted
            ? "تم التصويت من هذا الجهاز"
            : open
              ? "صوّت الآن"
              : "التصويت مغلق"}
        </button>
      </article>
    `;
  }).join("");
}

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.addEventListener("storage",render);

render();

setInterval(render,1000);
</script>

</body>
</html>
