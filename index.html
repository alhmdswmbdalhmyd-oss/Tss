<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التصويت</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080914;
  --card:#111426;
  --card2:#171a31;
  --purple:#8b5cf6;
  --cyan:#22d3ee;
  --text:#f8fafc;
  --muted:#9ca3af;
  --border:rgba(255,255,255,.09);
  --red:#ef4444;
  --green:#22c55e;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(139,92,246,.22),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(34,211,238,.14),transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(18px);
  background:rgba(8,9,20,.78);
  border-bottom:1px solid var(--border);
}

.nav{
  width:min(1150px,92%);
  margin:auto;
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  user-select:none;
}

.logoIcon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 30px rgba(139,92,246,.35);
  font-size:21px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  border-radius:30px;
  color:#dbeafe;
  font-size:13px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ef4444;
}

.dot.open{
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
}

.hero{
  width:min(1150px,92%);
  margin:55px auto 35px;
  text-align:center;
}

.badge{
  display:inline-block;
  padding:8px 16px;
  border-radius:30px;
  border:1px solid rgba(139,92,246,.3);
  background:rgba(139,92,246,.08);
  color:#c4b5fd;
  font-size:13px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(34px,6vw,65px);
  line-height:1.15;
  font-weight:1000;
  background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;
  margin:18px auto 0;
  color:var(--muted);
  line-height:1.9;
  font-size:16px;
}

.container{
  width:min(1150px,92%);
  margin:auto;
  padding-bottom:70px;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:35px 0 20px;
}

.sectionTitle h2{
  font-size:25px;
}

.sectionTitle span{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(23,26,49,.95),rgba(12,14,28,.95));
  border:1px solid var(--border);
  border-radius:24px;
  padding:14px;
  transition:.3s;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(139,92,246,.45);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.cardImage{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:17px;
  background:#0b0d19;
}

.cardBody{
  padding:17px 5px 5px;
}

.card h3{
  font-size:21px;
  margin-bottom:9px;
}

.card p{
  color:var(--muted);
  line-height:1.7;
  min-height:48px;
  font-size:14px;
}

.voteBtn{
  width:100%;
  border:0;
  margin-top:17px;
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  color:white;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),#6d28d9);
  box-shadow:0 10px 25px rgba(139,92,246,.2);
  transition:.25s;
}

.voteBtn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(139,92,246,.35);
}

.voteBtn:disabled{
  cursor:not-allowed;
  opacity:.55;
}

.empty{
  text-align:center;
  padding:65px 20px;
  border:1px dashed rgba(255,255,255,.13);
  border-radius:25px;
  background:rgba(255,255,255,.025);
}

.emptyIcon{
  font-size:45px;
  margin-bottom:15px;
}

.empty h3{
  margin-bottom:8px;
}

.empty p{
  color:var(--muted);
}

.notice{
  display:none;
  margin:25px 0;
  padding:16px 18px;
  border-radius:16px;
  background:rgba(34,211,238,.08);
  border:1px solid rgba(34,211,238,.2);
  color:#a5f3fc;
  text-align:center;
}

/* =========================
   لوحة الإدارة
========================= */

.adminPanel{
  display:none;
  width:min(1150px,92%);
  margin:30px auto;
  padding:25px;
  border:1px solid rgba(139,92,246,.35);
  border-radius:25px;
  background:linear-gradient(
    145deg,
    rgba(23,26,49,.98),
    rgba(10,12,25,.98)
  );
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.adminPanel.active{
  display:block;
}

.adminHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.adminHeader h2{
  font-size:25px;
}

.adminHeader p{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.closeAdmin{
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
  border-radius:12px;
  padding:10px 15px;
  cursor:pointer;
}

.adminGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.adminBox{
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.adminBox h3{
  margin-bottom:16px;
}

.adminBox label{
  display:block;
  color:#cbd5e1;
  font-size:13px;
  margin-bottom:8px;
}

.adminBox input,
.adminBox select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:#0b0d19;
  color:white;
  margin-bottom:12px;
  font-family:inherit;
}

.adminButtons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.adminBtn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  cursor:pointer;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),#6d28d9);
}

.adminBtn.red{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.adminBtn.green{
  background:linear-gradient(135deg,#22c55e,#15803d);
}

.adminCandidates{
  margin-top:20px;
  display:grid;
  gap:10px;
}

.adminCandidate{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
}

.adminCandidateInfo{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.adminCandidateInfo img{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:12px;
}

.adminCandidateInfo strong{
  display:block;
  margin-bottom:5px;
}

.voteNumber{
  color:#a5f3fc;
  font-size:12px;
}

.deleteBtn{
  border:0;
  background:rgba(239,68,68,.13);
  color:#fca5a5;
  border:1px solid rgba(239,68,68,.25);
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
}

footer{
  border-top:1px solid var(--border);
  text-align:center;
  padding:25px;
  color:#6b7280;
  font-size:12px;
}

@media(max-width:700px){

  .nav{
    min-height:65px;
  }

  .logo{
    font-size:16px;
  }

  .logoIcon{
    width:38px;
    height:38px;
  }

  .status{
    font-size:11px;
    padding:8px 10px;
  }

  .hero{
    margin-top:38px;
  }

  .hero p{
    font-size:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .cardImage{
    height:250px;
  }

  .adminGrid{
    grid-template-columns:1fr;
  }

  .adminHeader{
    align-items:flex-start;
  }

  .adminCandidate{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo" id="adminTrigger" title="">
      <div class="logoIcon">✓</div>
      <span>منصة التصويت</span>
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">جاري التحميل...</span>
    </div>

  </div>
</header>

<section class="hero">
  <div class="badge">✦ صوتك يصنع الفرق</div>

  <h1>اختر مرشحك</h1>

  <p>
    شارك بصوتك واختر المرشح الذي تراه مناسبًا.
    التصويت بسيط وسريع وآمن من خلال جهازك.
  </p>
</section>

<!-- =========================
     لوحة الإدارة المخفية
========================= -->

<section class="adminPanel" id="adminPanel">

  <div class="adminHeader">

    <div>
      <h2>⚙️ إدارة التصويت</h2>
      <p>إدارة المرشحين والأصوات</p>
    </div>

    <button class="closeAdmin" onclick="closeAdmin()">
      إغلاق
    </button>

  </div>

  <div class="adminGrid">

    <!-- زيادة التصويت -->

    <div class="adminBox">

      <h3>➕ زيادة التصويت</h3>

      <label>اختر المرشح</label>

      <select id="voteCandidate"></select>

      <label>عدد الأصوات التي تريد إضافتها</label>

      <input
        type="number"
        id="voteAmount"
        min="1"
        value="1"
      >

      <div class="adminButtons">

        <button
          class="adminBtn green"
          onclick="addVotes()"
        >
          زيادة التصويت
        </button>

      </div>

    </div>

    <!-- حذف المرشح -->

    <div class="adminBox">

      <h3>🗑️ حذف مرشح</h3>

      <label>اختر المرشح</label>

      <select id="deleteCandidate"></select>

      <div class="adminButtons">

        <button
          class="adminBtn red"
          onclick="deleteSelectedCandidate()"
        >
          حذف المرشح
        </button>

      </div>

    </div>

  </div>

  <div class="adminCandidates" id="adminCandidates"></div>

</section>

<main class="container">

  <div id="notice" class="notice"></div>

  <div class="sectionTitle">

    <h2>المرشحون</h2>

    <span id="candidateCount">
      0 مرشح
    </span>

  </div>

  <div id="candidates" class="grid"></div>

</main>

<footer>
  منصة التصويت © 2026
</footer>

<script>

const CANDIDATES_KEY = "candidates";
const VOTES_KEY = "votes";
const SETTINGS_KEY = "voteSettings";
const VOTED_KEY = "votedCandidate";

/* =========================
   قراءة المرشحين
========================= */

function getCandidates(){

  try{

    return JSON.parse(
      localStorage.getItem(CANDIDATES_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}

/* =========================
   قراءة الأصوات
========================= */

function getVotes(){

  try{

    return JSON.parse(
      localStorage.getItem(VOTES_KEY)
    ) || {};

  }catch(e){

    return {};

  }

}

/* =========================
   إعدادات التصويت
========================= */

function getSettings(){

  try{

    return JSON.parse(
      localStorage.getItem(SETTINGS_KEY)
    ) || {
      mode:"open",
      start:"",
      end:""
    };

  }catch(e){

    return {
      mode:"open",
      start:"",
      end:""
    };

  }

}

/* =========================
   حالة التصويت
========================= */

function getVotingState(){

  const settings = getSettings();
  const now = new Date();

  if(settings.mode === "closed"){
    return false;
  }

  if(settings.mode === "open"){
    return true;
  }

  if(settings.mode === "auto"){

    if(settings.start){

      const start = new Date(settings.start);

      if(now < start){
        return false;
      }

    }

    if(settings.end){

      const end = new Date(settings.end);

      if(now > end){
        return false;
      }

    }

    return true;

  }

  return false;

}

/* =========================
   حماية النص
========================= */

function escapeHtml(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================
   تحديث حالة التصويت
========================= */

function updateStatus(){

  const open = getVotingState();

  const dot =
    document.getElementById("statusDot");

  const text =
    document.getElementById("statusText");

  if(open){

    dot.classList.add("open");

    text.textContent =
      "التصويت مفتوح";

  }else{

    dot.classList.remove("open");

    text.textContent =
      "التصويت مغلق";

  }

}

/* =========================
   رسالة
========================= */

function showNotice(message){

  const notice =
    document.getElementById("notice");

  notice.textContent = message;

  notice.style.display = "block";

  setTimeout(()=>{

    notice.style.display = "none";

  },4000);

}

/* =========================
   تصويت المستخدم
========================= */

function vote(id){

  if(!getVotingState()){

    showNotice(
      "التصويت مغلق حاليًا."
    );

    return;

  }

  const alreadyVoted =
    localStorage.getItem(VOTED_KEY);

  if(alreadyVoted){

    showNotice(
      "لقد قمت بالتصويت مسبقًا من هذا الجهاز."
    );

    return;

  }

  const candidates =
    getCandidates();

  if(!candidates.some(
    c => String(c.id) === String(id)
  )){

    showNotice(
      "هذا المرشح غير موجود."
    );

    return;

  }

  const votes =
    getVotes();

  if(!votes[id]){
    votes[id] = 0;
  }

  votes[id]++;

  localStorage.setItem(
    VOTES_KEY,
    JSON.stringify(votes)
  );

  localStorage.setItem(
    VOTED_KEY,
    String(id)
  );

  showNotice(
    "تم تسجيل صوتك بنجاح ✓"
  );

  renderCandidates();
  renderAdmin();

}

/* =========================
   عرض المرشحين
========================= */

function renderCandidates(){

  const box =
    document.getElementById("candidates");

  const candidates =
    getCandidates();

  const open =
    getVotingState();

  const voted =
    localStorage.getItem(VOTED_KEY);

  document.getElementById(
    "candidateCount"
  ).textContent =
    `${candidates.length} مرشح`;

  if(!candidates.length){

    box.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >

        <div class="emptyIcon">
          🗳️
        </div>

        <h3>
          لا يوجد مرشحون حتى الآن
        </h3>

        <p>
          سيظهر المرشحون هنا عندما تتم إضافتهم من لوحة الإدارة.
        </p>

      </div>

    `;

    return;

  }

  const votes =
    getVotes();

  box.innerHTML =
    candidates.map(candidate => {

      const selected =
        voted &&
        String(voted) ===
        String(candidate.id);

      let buttonText =
        "صوّت الآن";

      if(selected){

        buttonText =
          "✓ تم التصويت لهذا المرشح";

      }else if(voted){

        buttonText =
          "تم التصويت مسبقًا";

      }else if(!open){

        buttonText =
          "التصويت مغلق";

      }

      const voteCount =
        Number(votes[candidate.id] || 0);

      return `

        <article class="card">

          <img
            class="cardImage"
            src="${
              candidate.image ||
              createPlaceholder(candidate.name)
            }"
            alt="${escapeHtml(candidate.name)}"
          >

          <div class="cardBody">

            <h3>
              ${escapeHtml(candidate.name)}
            </h3>

            <p>
              ${
                escapeHtml(
                  candidate.description ||
                  "مرشح في هذه المسابقة"
                )
              }
            </p>

            <div style="
              margin-top:10px;
              color:#a5f3fc;
              font-size:13px;
            ">
              عدد الأصوات: ${voteCount}
            </div>

            <button
              class="voteBtn"
              onclick="vote('${String(candidate.id).replace(/'/g,"\\'")}')"
              ${(!open || voted) ? "disabled" : ""}
            >
              ${buttonText}
            </button>

          </div>

        </article>

      `;

    }).join("");

}

/* =========================
   صورة افتراضية
========================= */

function createPlaceholder(name){

  const text =
    encodeURIComponent(
      name || "مرشح"
    );

  return `data:image/svg+xml;charset=UTF-8,

  <svg xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="500">

    <rect
      width="100%"
      height="100%"
      fill="%23111426"
    />

    <text
      x="50%"
      y="50%"
      dominant-baseline="middle"
      text-anchor="middle"
      fill="%23a78bfa"
      font-size="45"
      font-family="Arial"
    >
      ${text}
    </text>

  </svg>`;

}

/* =========================
   فتح لوحة الإدارة
   الضغط على شعار المنصة
========================= */

let adminClicks = 0;
let adminClickTimer;

document
  .getElementById("adminTrigger")
  .addEventListener("click",()=>{

    adminClicks++;

    clearTimeout(adminClickTimer);

    adminClickTimer =
      setTimeout(()=>{

        adminClicks = 0;

      },800);

    if(adminClicks >= 3){

      adminClicks = 0;

      openAdmin();

    }

  });

/* =========================
   فتح الإدارة
========================= */

function openAdmin(){

  const panel =
    document.getElementById("adminPanel");

  panel.classList.add("active");

  renderAdmin();

  panel.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}

/* =========================
   إغلاق الإدارة
========================= */

function closeAdmin(){

  document
    .getElementById("adminPanel")
    .classList.remove("active");

}

/* =========================
   عرض قائمة الإدارة
========================= */

function renderAdmin(){

  const candidates =
    getCandidates();

  const votes =
    getVotes();

  const voteSelect =
    document.getElementById(
      "voteCandidate"
    );

  const deleteSelect =
    document.getElementById(
      "deleteCandidate"
    );

  if(!voteSelect || !deleteSelect){
    return;
  }

  if(!candidates.length){

    voteSelect.innerHTML =
      `<option value="">لا يوجد مرشحون</option>`;

    deleteSelect.innerHTML =
      `<option value="">لا يوجد مرشحون</option>`;

  }else{

    voteSelect.innerHTML =
      candidates.map(candidate => `

        <option value="${escapeHtml(candidate.id)}">

          ${escapeHtml(candidate.name)}
          — ${Number(votes[candidate.id] || 0)} صوت

        </option>

      `).join("");

    deleteSelect.innerHTML =
      candidates.map(candidate => `

        <option value="${escapeHtml(candidate.id)}">

          ${escapeHtml(candidate.name)}

        </option>

      `).join("");

  }

  const adminCandidates =
    document.getElementById(
      "adminCandidates"
    );

  adminCandidates.innerHTML =
    candidates.map(candidate => {

      const count =
        Number(votes[candidate.id] || 0);

      return `

        <div class="adminCandidate">

          <div class="adminCandidateInfo">

            <img
              src="${
                candidate.image ||
                createPlaceholder(candidate.name)
              }"
              alt="${escapeHtml(candidate.name)}"
            >

            <div>

              <strong>
                ${escapeHtml(candidate.name)}
              </strong>

              <span class="voteNumber">
                ${count} صوت
              </span>

            </div>

          </div>

          <button
            class="deleteBtn"
            onclick="deleteCandidate('${String(candidate.id).replace(/'/g,"\\'")}')"
          >
            حذف
          </button>

        </div>

      `;

    }).join("");

}

/* =========================
   زيادة الأصوات يدويًا
========================= */

function addVotes(){

  const id =
    document.getElementById(
      "voteCandidate"
    ).value;

  const amount =
    parseInt(
      document.getElementById(
        "voteAmount"
      ).value,
      10
    );

  if(!id){

    showNotice(
      "اختر مرشحًا أولًا."
    );

    return;

  }

  if(!Number.isInteger(amount) || amount < 1){

    showNotice(
      "أدخل عدد أصوات صحيح."
    );

    return;

  }

  const candidates =
    getCandidates();

  const candidate =
    candidates.find(
      c => String(c.id) === String(id)
    );

  if(!candidate){

    showNotice(
      "المرشح غير موجود."
    );

    return;

  }

  const votes =
    getVotes();

  if(!votes[id]){
    votes[id] = 0;
  }

  votes[id] += amount;

  localStorage.setItem(
    VOTES_KEY,
    JSON.stringify(votes)
  );

  showNotice(
    `تمت إضافة ${amount} صوت إلى ${candidate.name} ✓`
  );

  renderCandidates();
  renderAdmin();

}

/* =========================
   حذف المرشح
========================= */

function deleteSelectedCandidate(){

  const id =
    document.getElementById(
      "deleteCandidate"
    ).value;

  if(!id){

    showNotice(
      "اختر مرشحًا أولًا."
    );

    return;

  }

  deleteCandidate(id);

}

/* =========================
   حذف مرشح بالكامل
========================= */

function deleteCandidate(id){

  const candidates =
    getCandidates();

  const candidate =
    candidates.find(
      c => String(c.id) === String(id)
    );

  if(!candidate){

    showNotice(
      "المرشح غير موجود."
    );

    return;

  }

  const confirmed =
    confirm(
      `هل تريد حذف المرشح "${candidate.name}" نهائيًا؟`
    );

  if(!confirmed){
    return;
  }

  const newCandidates =
    candidates.filter(
      c => String(c.id) !== String(id)
    );

  localStorage.setItem(
    CANDIDATES_KEY,
    JSON.stringify(newCandidates)
  );

  const votes =
    getVotes();

  delete votes[id];

  localStorage.setItem(
    VOTES_KEY,
    JSON.stringify(votes)
  );

  const voted =
    localStorage.getItem(VOTED_KEY);

  if(voted &&
     String(voted) === String(id)){

    localStorage.removeItem(
      VOTED_KEY
    );

  }

  showNotice(
    `تم حذف ${candidate.name} بنجاح.`
  );

  renderCandidates();
  renderAdmin();

}
