<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صوتك</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🗳️ صوتك</div>
  <div id="statusBadge" class="status">التصويت مغلق</div>
</header>

<main>

  <section class="hero">
    <h1>اختر من يستحق صوتك</h1>
    <p>صوّت للمرشح الذي تراه مناسبًا.</p>

    <div id="timerBox" class="timer">
      التصويت مغلق حاليًا
    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>المرشحون</h2>
      <span id="candidateCount">0</span>
    </div>

    <div id="candidates" class="candidates"></div>

    <div id="message" class="message"></div>
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
