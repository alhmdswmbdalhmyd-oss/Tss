<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🔐 لوحة الإدارة</h1>
    <input type="password" id="adminPassword" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p id="loginMessage"></p>
  </div>
</div>

<div id="dashboard" class="dashboard" style="display:none">

  <header class="admin-header">
    <h1>🗳️ إدارة التصويت</h1>
    <button onclick="logout()" class="logout-btn">تسجيل خروج</button>
  </header>

  <section class="stats">
    <div class="stat-box">
      <span>عدد المرشحين</span>
      <strong id="totalCandidates">0</strong>
    </div>

    <div class="stat-box">
      <span>إجمالي الأصوات</span>
      <strong id="totalVotes">0</strong>
    </div>

    <div class="stat-box">
      <span>حالة التصويت</span>
      <strong id="currentStatus">مغلق</strong>
    </div>
  </section>

  <section class="panel">
    <h2>⏰ التحكم بوقت التصويت</h2>

    <label>وقت البداية</label>
    <input type="datetime-local" id="startTime">

    <label>وقت النهاية</label>
    <input type="datetime-local" id="endTime">

    <div class="buttons">
      <button onclick="saveVotingTime()">حفظ الوقت</button>
      <button onclick="openVotingNow()">فتح الآن</button>
      <button onclick="closeVotingNow()">إغلاق الآن</button>
      <button onclick="automaticMode()">الوضع التلقائي</button>
    </div>
  </section>

  <section class="panel">
    <h2>➕ إضافة مرشح</h2>

    <input type="text" id="candidateName" placeholder="اسم المرشح">

    <label class="image-upload">
      📷 إضافة صورة
      <input
        type="file"
        id="candidateImage"
        accept="image/*"
        onchange="previewImage(event)"
      >
    </label>

    <img id="imagePreview" class="image-preview" style="display:none">

    <textarea
      id="candidateDescription"
      placeholder="وصف المرشح"
    ></textarea>

    <button onclick="addCandidate()" class="add-btn">
      إضافة المرشح
    </button>
  </section>

  <section class="panel">
    <h2>👥 المرشحون والأصوات</h2>
    <div id="candidateList"></div>
  </section>

</div>

<script src="admin.js"></script>
</body>
</html>
