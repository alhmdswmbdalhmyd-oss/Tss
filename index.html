
CTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#080914;
--card:#111426;
--card2:#171a31;
--purple:#8b5cf6;
--cyan:#22d3ee;
--text:#f8fafc;
--muted:#9ca3af;
--border:rgba(255,255,255,.09);
--green:#22c55e;
--red:#ef4444;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 15% 10%,rgba(139,92,246,.22),transparent 30%),
radial-gradient(circle at 85% 20%,rgba(34,211,238,.14),transparent 28%),
var(--bg);
color:var(--text);
min-height:100vh;
}

header{
position:sticky;
top:0;
z-index:20;
backdrop-filter:blur(18px);
background:rgba(8,9,20,.78);
border-bottom:1px solid var(--border);
}

.nav{
width:min(1150px,92%);
margin:auto;
min-height:75px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:20px;
font-weight:900;
}

.logoIcon{
width:43px;
height:43px;
border-radius:14px;
display:grid;
place-items:center;
background:linear-gradient(135deg,var(--purple),var(--cyan));
box-shadow:0 0 30px rgba(139,92,246,.35);
font-size:21px;
}

.status{
display:flex;
align-items:center;
gap:8px;
padding:9px 14px;
border:1px solid var(--border);
background:rgba(255,255,255,.04);
border-radius:30px;
color:#dbeafe;
font-size:13px;
}

.dot{
width:9px;
height:9px;
border-radius:50%;
background:#ef4444;
}

.dot.open{
background:#22c55e;
box-shadow:0 0 12px #22c55e;
}

.container{
width:min(1150px,92%);
margin:40px auto;
padding-bottom:70px;
}

.panel{
background:linear-gradient(145deg,rgba(23,26,49,.95),rgba(12,14,28,.95));
border:1px solid var(--border);
border-radius:24px;
padding:25px;
margin-bottom:25px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.panel h2{
margin-bottom:20px;
font-size:23px;
}

.buttons{
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:0;
cursor:pointer;
color:white;
font-family:inherit;
font-weight:800;
border-radius:14px;
padding:13px 20px;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.openBtn{
background:linear-gradient(135deg,#22c55e,#15803d);
}

.closeBtn{
background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.addBtn{
background:linear-gradient(135deg,var(--purple),#6d28d9);
}

.heartBtn{
background:linear-gradient(135deg,#ec4899,#be185d);
font-size:18px;
}

.deleteBtn{
background:#991b1b;
padding:10px 14px;
}

select,
input{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid var(--border);
background:#0b0d19;
color:white;
outline:none;
font-family:inherit;
}

.formGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.candidate{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:16px;
border:1px solid var(--border);
background:rgba(255,255,255,.03);
border-radius:16px;
margin-top:12px;
}

.candidateInfo h3{
margin-bottom:7px;
}

.candidateInfo span{
color:var(--cyan);
font-size:13px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.notice{
display:none;
padding:14px;
border-radius:14px;
margin-bottom:20px;
background:rgba(34,211,238,.08);
border:1px solid rgba(34,211,238,.2);
color:#a5f3fc;
text-align:center;
}

@media(max-width:600px){
.nav{
min-height:65px;
}

.logo{
font-size:16px;
}

.logoIcon{
width:38px;
height:38px;
}

.formGrid{
grid-template-columns:1fr;
}

.candidate{
align-items:flex-start;
flex-direction:column;
}

.actions{
width:100%;
}

.actions button{
flex:1;
}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">
<div class="logoIcon">✓</div>
<span>إدارة التصويت</span>
</div>

<div class="status">
<span class="dot" id="statusDot"></span>
<span id="statusText">جاري التحميل...</span>
</div>
</div>
</header>

<main class="container">

<div id="notice" class="notice"></div>

<div class="panel">
<h2>إعدادات التصويت</h2>

<div class="buttons">
<button class="openBtn" onclick="openVoting()">فتح التصويت</button>
<button class="closeBtn" onclick="closeVoting()">إغلاق التصويت</button>
</div>
</div>

<div class="panel">
<h2>زيادة تصويتات</h2>

<div class="formGrid">
<div>
<select id="voteCandidate"></select>
</div>

<div>
<input id="voteAmount" type="number" min="1" placeholder="عدد التصويتات">
</div>
</div>

<button class="heartBtn" onclick="increaseVotes()">♥ زيادة التصويتات</button>
</div>

<div class="panel">
<h2>إضافة مرشح</h2>

<div class="formGrid">
<input id="candidateName" placeholder="اسم المرشح">
<input id="candidateDescription" placeholder="وصف المرشح">
</div>

<input id="candidateImage" placeholder="رابط صورة المرشح">

<br><br>

<button class="addBtn" onclick="addCandidate()">إضافة المرشح</button>
</div>

<div class="panel">
<h2>المرشحون</h2>
<div id="candidateList"></div>
</div>

</main>

<script>
const CANDIDATES_KEY="candidates";
const VOTES_KEY="votes";
const SETTINGS_KEY="voteSettings";

function getCandidates(){
try{
return JSON.parse(localStorage.getItem(CANDIDATES_KEY))||[];
}catch(e){
return[];
}
}

function getVotes(){
try{
return JSON.parse(localStorage.getItem(VOTES_KEY))||{};
}catch(e){
return{};
}
}

function saveCandidates(data){
localStorage.setItem(CANDIDATES_KEY,JSON.stringify(data));
}

function saveVotes(data){
localStorage.setItem(VOTES_KEY,JSON.stringify(data));
}

function getSettings(){
try{
return JSON.parse(localStorage.getItem(SETTINGS_KEY))||{
mode:"open",
start:"",
end:""
};
}catch(e){
return{
mode:"open",
start:"",
end:""
};
}
}

function saveSettings(settings){
localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function openVoting(){
saveSettings({
mode:"open",
start:"",
end:""
});

updateStatus();
showNotice("تم فتح التصويت");
}

function closeVoting(){
saveSettings({
mode:"closed",
start:"",
end:""
});

updateStatus();
showNotice("تم إغلاق التصويت");
}

function updateStatus(){
const settings=getSettings();
const open=settings.mode==="open";

const dot=document.getElementById("statusDot");
const text=document.getElementById("statusText");

if(open){
dot.classList.add("open");
text.textContent="التصويت مفتوح";
}else{
dot.classList.remove("open");
text.textContent="التصويت مغلق";
}
}

function showNotice(message){
const notice=document.getElementById("notice");
notice.textContent=message;
notice.style.display="block";

setTimeout(()=>{
notice.style.display="none";
},3000);
}

function addCandidate(){

const name=document.getElementById("candidateName").value.trim();
const description=document.getElementById("candidateDescription").value.trim();
const image=document.getElementById("candidateImage").value.trim();

if(!name){
showNotice("اكتب اسم المرشح");
return;
}

const candidates=getCandidates();

const candidate={
id:Date.now(),
name:name,
description:description,
image:image
};

candidates.push(candidate);

saveCandidates(candidates);

const votes=getVotes();
votes[candidate.id]=0;
saveVotes(votes);

document.getElementById("candidateName").value="";
document.getElementById("candidateDescription").value="";
document.getElementById("candidateImage").value="";

renderCandidates();
updateCandidateSelect();

showNotice("تمت إضافة المرشح بنجاح");
}

function deleteCandidate(id){

const candidates=getCandidates();

const updated=candidates.filter(c=>String(c.id)!==String(id));

saveCandidates(updated);

const votes=getVotes();
delete votes[id];
saveVotes(votes);

renderCandidates();
updateCandidateSelect();

showNotice("تم حذف المرشح");
}

function increaseVotes(){

const candidateId=document.getElementById("voteCandidate").value;
const amount=parseInt(document.getElementById("voteAmount").value);

if(!candidateId){
showNotice("اختر المرشح أولًا");
return;
}

if(!amount || amount<1){
showNotice("اكتب عدد التصويتات");
return;
}

const votes=getVotes();

if(!votes[candidateId]){
votes[candidateId]=0;
}

votes[candidateId]+=amount;

saveVotes(votes);

document.getElementById("voteAmount").value="";

renderCandidates();

showNotice("تمت زيادة التصويتات ♥");
}

function updateCandidateSelect(){

const select=document.getElementById("voteCandidate");
const candidates=getCandidates();

if(!candidates.length){
select.innerHTML='<option value="">لا يوجد مرشحون</option>';
return;
}

select.innerHTML=candidates.map(c=>
`<option value="${String(c.id)}">${escapeHtml(c.name)}</option>`
).join("");
}

function renderCandidates(){

const box=document.getElementById("candidateList");
const candidates=getCandidates();
const votes=getVotes();

if(!candidates.length){
box.innerHTML="<p style='color:#9ca3af'>لا يوجد مرشحون حاليًا.</p>";
return;
}

box.innerHTML=candidates.map(candidate=>{

const count=votes[candidate.id]||0;

return `
<div class="candidate">

<div class="candidateInfo">
<h3>${escapeHtml(candidate.name)}</h3>
<span>عدد الأصوات: ${count}</span>
</div>

<div class="actions">
<button class="heartBtn" onclick="quickIncrease('${String(candidate.id)}')">♥ +1</button>
<button class="deleteBtn" onclick="deleteCandidate('${String(candidate.id)}')">حذف</button>
</div>

</div>
`;

}).join("");
}

function quickIncrease(id){

const votes=getVotes();

if(!votes[id]){
votes[id]=0;
}

votes[id]++;

saveVotes(votes);

renderCandidates();

showNotice("تمت إضافة صوت ♥");
}

function escapeHtml(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

renderCandidates();
updateCandidateSelect();
updateStatus();

setInterval(()=>{
renderCandidates();
updateCandidateSelect();
updateStatus();
},1000);

window.addEventListener("storage",()=>{
renderCandidates();
updateCandidateSelect();
updateStatus();
});
</script>

</body>
</html
