<!Doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#e9edf2;
    --soft:#f7f9fc;
    --radius:22px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Cairo,Arial,sans-serif;
    background:#fff;
    color:var(--ink);
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.5s;
}

.loader-box{
    text-align:center;
    width:min(360px,86vw);
}

.loader-logo{
    font-size:34px;
    font-weight:800;
    letter-spacing:1px;
}

.loader-line{
    height:3px;
    background:#eef0f3;
    border-radius:9px;
    overflow:hidden;
    margin-top:22px;
}

.loader-line span{
    display:block;
    width:0;
    height:100%;
    background:#111;
    animation:load 1.8s ease forwards;
}

@keyframes load{
    to{
        width:100%;
    }
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.nav{
    max-width:1250px;
    margin:auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
}

.brand{
    font-size:23px;
    font-weight:800;
    margin-left:auto;
}

.nav-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:13px;
    padding:10px 13px;
    position:relative;
}

.badge{
    position:absolute;
    top:-7px;
    left:-7px;
    min-width:21px;
    height:21px;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    padding:0 5px;
}

/* HERO */

.hero{
    max-width:1250px;
    margin:24px auto 0;
    padding:0 22px;
}

.hero-card{
    min-height:480px;
    border:1px solid var(--line);
    border-radius:32px;
    background:
        radial-gradient(
            circle at 20% 20%,
            #fff,
            #f6f8fb 60%,
            #eef1f5
        );
    display:grid;
    place-items:center;
    text-align:center;
    padding:50px 20px;
    overflow:hidden;
    position:relative;
}

.hero-card:after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    border:1px solid #fff;
    box-shadow:
        0 0 0 35px rgba(255,255,255,.5),
        0 0 0 70px rgba(255,255,255,.35);
}

.hero-content{
    position:relative;
    z-index:1;
}

.eyebrow{
    font-size:13px;
    color:var(--muted);
    letter-spacing:2px;
}

.hero h1{
    font-size:clamp(42px,8vw,82px);
    margin:10px 0;
    font-weight:800;
}

.hero p{
    color:var(--muted);
    max-width:560px;
    margin:0 auto 25px;
    line-height:2;
}

/* BUTTONS */

.primary{
    background:#111;
    color:#fff;
    border:0;
    border-radius:14px;
    padding:13px 22px;
}

.ghost{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 18px;
}

/* PRODUCTS */

.container{
    max-width:1250px;
    margin:65px auto;
    padding:0 22px;
}

.top-row{
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.search{
    min-width:min(360px,100%);
    flex:1;
    max-width:460px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 16px;
    outline:none;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:22px 0;
}

.tab{
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:10px 16px;
}

.tab.active{
    background:#111;
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.card{
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    background:#fff;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 12px 30px rgba(17,24,39,.08);
}

.pic{
    height:230px;
    background:#f5f6f8;
    display:grid;
    place-items:center;
    overflow:hidden;
}

.pic img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:17px;
}

.card h3{
    margin:0 0 7px;
}

.desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.8;
    min-height:45px;
}

.price{
    font-size:20px;
    font-weight:800;
    margin:13px 0;
}

.stock{
    font-size:12px;
    color:#b45309;
    margin-bottom:8px;
}

/* TRACK */

.track-section{
    margin-top:65px;
}

.track-box{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:25px;
    padding:25px;
}

.track-form{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.track-form input{
    flex:1;
    min-width:220px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px;
    background:#fff;
}

.result{
    margin-top:18px;
}

.status-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
}

.status-pill{
    display:inline-block;
    padding:7px 12px;
    border-radius:99px;
    background:#f0f2f5;
    font-weight:700;
    font-size:13px;
    margin:8px 0;
}

/* FOOTER */

footer{
    border-top:1px solid var(--line);
    margin-top:80px;
    padding:35px 22px;
    text-align:center;
    color:var(--muted);
}

/* MODALS */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:500;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.open{
    display:flex;
}

.sheet{
    width:min(720px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:24px;
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    border:0;
    background:#f2f3f5;
    border-radius:12px;
    padding:8px 12px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    width:30px;
    height:30px;
}

.totals{
    margin-top:18px;
    background:var(--soft);
    border-radius:16px;
    padding:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

/* CHECKOUT */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
    margin-top:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field input,
.field textarea,
.field select{
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    outline:none;
    background:#fff;
}

.method{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.method label{
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px;
    cursor:pointer;
}

.method input{
    accent-color:#111;
}

.notice{
    padding:12px;
    border-radius:13px;
    background:#f6f7f9;
    color:#4b5563;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

/* MOBILE */

@media(max-width:650px){

    .nav{
        padding:12px 14px;
    }

    .brand{
        font-size:19px;
    }

    .hero{
        padding:0 12px;
    }

    .hero-card{
        min-height:430px;
        border-radius:25px;
    }

    .container{
        padding:0 14px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .method{
        grid-template-columns:1fr;
    }

    .nav-btn span{
        display:none;
    }
}
</style>
</head>

<body>

<!-- LOADER -->

<div id="loader">
    <div class="loader-box">
        <div class="loader-logo">
            NEXO STORE
        </div>

        <div class="loader-line">
            <span></span>
        </div>
    </div>
</div>


<!-- HEADER -->

<header>

    <div class="nav">

        <div class="brand">
            NEXO STORE
        </div>

        <div class="nav-actions">

            <button
                class="nav-btn"
                onclick="openTrack()"
            >
                استعلام الطلب
            </button>

            <button
                class="nav-btn"
                onclick="openCart()"
            >
                السلة 🛒

                <b
                    class="badge"
                    id="cartCount"
                >
                    0
                </b>

            </button>

        </div>

    </div>

</header>


<!-- HERO -->

<section class="hero">

    <div class="hero-card">

        <div class="hero-content">

            <div class="eyebrow">
                WELCOME TO NEXO
            </div>

            <h1>
                كل ما تحتاجه، في مكان واحد.
            </h1>

            <p id="heroText">
                تسوق بسهولة، ادفع بأمان،
                وتابع طلبك حتى يصل إليك.
            </p>

            <button
                class="primary"
                onclick="document.getElementById('products').scrollIntoView()"
            >
                ابدأ التسوق
            </button>

        </div>

    </div>

</section>


<!-- PRODUCTS -->

<main
    class="container"
    id="products"
>

    <div class="top-row">

        <div>

            <h2 style="margin:0">
                المنتجات
            </h2>

            <small style="color:#6b7280">
                اختَر ما يناسبك
            </small>

        </div>

        <input
            class="search"
            id="search"
            placeholder="ابحث عن منتج..."
            oninput="renderProducts()"
        >

    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="setCat('all',this)"
        >
            الكل
        </button>

        <button
            class="tab"
            onclick="setCat('digital',this)"
        >
            المنتجات الرقمية
        </button>

        <button
            class="tab"
            onclick="setCat('physical',this)"
        >
            المنتجات المتنوعة
        </button>

    </div>


    <div
        class="grid"
        id="productsGrid"
    ></div>


    <!-- TRACK ORDER -->

    <section
        class="track-section"
        id="track"
    >

        <h2>
            الاستعلام عن الطلب
        </h2>

        <div class="track-box">

            <p style="color:#6b7280">
                اكتب رقم طلبك لمشاهدة آخر حالة.
            </p>

            <div class="track-form">

                <input
                    id="trackNumber"
                    placeholder="مثال: NEXO-12345678"
                >

                <button
                    class="primary"
                    onclick="trackOrder()"
                >
                    عرض الحالة
                </button>

            </div>

            <div
                class="result"
                id="trackResult"
            ></div>

        </div>

    </section>

</main>


<footer id="footer"></footer>


<!-- CART -->

<div
    class="modal"
    id="cartModal"
>

    <div class="sheet">

        <div class="sheet-head">

            <h2>
                سلة المشتريات
            </h2>

            <button
                class="close"
                onclick="closeCart()"
            >
                إغلاق
            </button>

        </div>

        <div id="cartItems"></div>

        <div id="cartCheckout"></div>

    </div>

</div>


<!-- CHECKOUT -->

<div
    class="modal"
    id="checkoutModal"
>

    <div class="sheet">

        <div class="sheet-head">

            <h2>
                إتمام الطلب
            </h2>

            <button
                class="close"
                onclick="closeCheckout()"
            >
                إغلاق
            </button>

        </div>

        <div id="checkoutBody"></div>

    </div>

</div>


<script>

const K = {

    products:"nexo_products",

    orders:"nexo_orders",

    settings:"nexo_settings",

    cart:"nexo_cart"

};


let products =
JSON.parse(
    localStorage.getItem(K.products) || "[]"
);

let settings =
JSON.parse(
    localStorage.getItem(K.settings) || "{}"
);

let cart =
JSON.parse(
    localStorage.getItem(K.cart) || "[]"
);

let category = "all";


const statusMap = {

    new:[
        "🟡",
        "جديد",
        "تم استلام طلبك."
    ],

    processing:[
        "🔵",
        "قيد التجهيز",
        "جاري تجهيز طلبك الآن."
    ],

    out:[
        "🟠",
        "خرج للتوصيل",
        "طلبك في الطريق إليك."
    ],

    delivered:[
        "🟢",
        "تم التسليم",
        "تم تسليم طلبك بنجاح."
    ],

    cancelled:[
        "🔴",
        "ملغي",
        "تم إلغاء هذا الطلب."
    ]

};


function saveCart(){

    localStorage.setItem(
        K.cart,
        JSON.stringify(cart)
    );

    updateCartCount();

}


function saveProducts(){

    localStorage.setItem(
        K.products,
        JSON.stringify(products)
    );

}


function money(number){

    return Number(number || 0)
        .toFixed(2)
        .replace(".00","")
        + " ر.س";

}


function discountFor(subtotal){

    const tiers =
        settings.wholesaleTiers ||
        [
            {
                min:5,
                percent:5
            },
            {
                min:10,
                percent:10
            },
            {
                min:20,
                percent:15
            }
        ];

    const quantity =
        cart.reduce(
            (total,item)=>
                total + Number(item.qty || 0),
            0
        );

    let percent = 0;

    tiers.forEach(tier=>{

        if(
            quantity >= Number(tier.min)
        ){

            percent =
                Math.max(
                    percent,
                    Number(tier.percent)
                );

        }

    });


    return {

        percent,

        value:
            subtotal * percent / 100

    };

}


function updateCartCount(){

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.reduce(
            (total,item)=>
                total + Number(item.qty || 0),
            0
        );

}


function setCat(cat,button){

    category = cat;

    document
        .querySelectorAll(".tab")
        .forEach(
            item =>
                item.classList.remove("active")
        );

    button.classList.add("active");

    renderProducts();

}


function escapeHtml(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            character =>
            ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[character]
        );

}


function renderProducts(){

    const search =
        (
            document.getElementById(
                "search"
            ).value || ""
        ).toLowerCase();


    const list =
        products.filter(product =>

            (
                category === "all" ||
                product.type === category
            )

            &&

            (
                (product.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (product.description || "")
                    .toLowerCase()
                    .includes(search)
            )

        );


    const grid =
        document.getElementById(
            "productsGrid"
        );


    if(!list.length){

        grid.innerHTML = `
            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:55px;
                    color:#777
                "
            >
                لا توجد منتجات حاليًا.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        list.map(product => {

            const out =
                product.type === "physical" &&
                Number(product.quantity) <= 0;

            const low =
                product.type === "physical" &&
                Number(product.quantity) > 0 &&
                Number(product.quantity) <= 3;


            return `

            <article class="card">

                <div class="pic">

                    ${
                        product.image

                        ?

                        `
                        <img
                            src="${product.image}"
                            alt=""
                        >
                        `

                        :

                        `
                        <span
                            style="color:#9ca3af"
                        >
                            NEXO
                        </span>
                        `
                    }

                </div>


                <div class="card-body">

                    <h3>
                        ${escapeHtml(product.name || "منتج")}
                    </h3>

                    <div class="desc">
                        ${escapeHtml(product.description || "")}
                    </div>


                    ${
                        low

                        ?

                        `
                        <div class="stock">
                            متبقي قليل
                        </div>
                        `

                        :

                        ""
                    }


                    ${
                        out

                        ?

                        `
                        <div
                            class="stock"
                            style="color:#b91c1c"
                        >
                            نفد من المخزون
                        </div>
                        `

                        :

                        ""
                    }


                    <div class="price">
                        ${money(product.price)}
                    </div>


                    <button
                        class="primary"
                        style="width:100%"
                        ${
                            out
                            ?
                            "disabled style='width:100%;opacity:.45'"
                            :
                            ""
                        }
                        onclick="addToCart('${product.id}')"
                    >

                        ${
                            out
                            ?
                            "نفد المخزون"
                            :
                            "أضف للسلة"
                        }

                    </button>

                </div>

            </article>

            `;

        }).join("");

}


function addToCart(id){

    const product =
        products.find(
            item =>
                String(item.id) === String(id)
        );


    if(!product){

        return;

    }


    const item =
        cart.find(
            item =>
                String(item.id) === String(id)
        );


    if(
        product.type === "physical" &&
        Number(product.quantity)
        <= Number(item?.qty || 0)
    ){

        alert(
            "الكمية المتاحة غير كافية"
        );

        return;

    }


    if(item){

        item.qty++;

    }else{

        cart.push({

            id:product.id,

            qty:1

        });

    }


    saveCart();

    openCart();

}


function removeItem(id){

    cart =
        cart.filter(
            item =>
                String(item.id)
                !== String(id)
        );

    saveCart();

    renderCart();

}


function changeQty(id,difference){

    const item =
        cart.find(
            item =>
                String(item.id)
                === String(id)
        );


    if(!item){

        return;

    }


    const product =
        products.find(
            item =>
                String(item.id)
                === String(id)
        );


    let quantity =
        Number(item.qty)
        + difference;


    if(quantity <= 0){

        removeItem(id);

        return;

    }


    if(
        product.type === "physical" &&
        quantity >
        Number(product.quantity)
    ){

        return;

    }


    item.qty = quantity;

    saveCart();

    renderCart();

}


function cartSummary(){

    let subtotal = 0;


    cart.forEach(item=>{

        const product =
            products.find(
                product =>
                    String(product.id)
                    === String(item.id)
            );


        if(product){

            subtotal +=
                Number(product.price)
                * Number(item.qty);

        }

    });


    const discount =
        discountFor(subtotal);


    const hasPhysical =
        cart.some(item=>{

            const product =
                products.find(
                    product =>
                        String(product.id)
                        === String(item.id)
                );

            return product?.type === "physical";

        });


    const delivery =
        hasPhysical
        ?
        Number(settings.deliveryFee || 0)
        :
        0;


    return {

        subtotal,

        discount:
            discount.value,

        percent:
            discount.percent,

        delivery,

        total:
            Math.max(
                0,
                subtotal -
                discount.value +
                delivery
            )

    };

}


function renderCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    if(!cart.length){

        box.innerHTML = `
            <div
                style="
                    padding:40px;
                    text-align:center;
                    color:#777
                "
            >
                السلة فارغة.
            </div>
        `;

        document.getElementById(
            "cartCheckout"
        ).innerHTML = "";

        return;

    }


    box.innerHTML =
        cart.map(item=>{

            const product =
                products.find(
                    product =>
                        String(product.id)
                        === String(item.id)
                );


            if(!product){

                return "";

            }


            return `

            <div class="cart-item">

                <div>

                    <b>
                        ${escapeHtml(product.name)}
                    </b>

                    <div
                        style="color:#777"
                    >
                        ${money(product.price)}
                        ×
                        ${item.qty}
                    </div>

                </div>


                <div class="qty">

                    <button
                        onclick="
                            changeQty(
                                '${product.id}',
                                -1
                            )
                        "
                    >
                        −
                    </button>

                    <span>
                        ${item.qty}
                    </span>

                    <button
                        onclick="
                            changeQty(
                                '${product.id}',
                                1
                            )
                        "
                    >
                        +
                    </button>

                    <button
                        onclick="
                            removeItem(
                                '${product.id}'
                            )
                        "
                        style="
                            border:0;
                            background:#fff
                        "
                    >
                        🗑️
                    </button>

                </div>

            </div>

            `;

        }).join("");


    const summary =
        cartSummary();


    document.getElementById(
        "cartCheckout"
    ).innerHTML = `

        <div class="totals">

            <div class="row">

                <span>
                    المجموع
                </span>

                <b>
                    ${money(summary.subtotal)}
                </b>

            </div>


            ${
                summary.percent

                ?

                `
                <div class="row">

                    <span>
                        خصم الجملة
                        (${summary.percent}%)
                    </span>

                    <b>
                        −
                        ${money(summary.discount)}
                    </b>

                </div>
                `

                :

                ""
            }


            ${
                summary.delivery

                ?

                `
                <div class="row">

                    <span>
                        التوصيل
                    </span>

                    <b>
                        ${money(summary.delivery)}
                    </b>

                </div>
                `

                :

                ""
            }


            <div
                class="row"
                style="font-size:19px"
            >

                <span>
                    الإجمالي
                </span>

                <b>
                    ${money(summary.total)}
                </b>

            </div>

        </div>


        <button
            class="primary"
            style="
                width:100%;
                margin-top:12px
            "
            onclick="openCheckout()"
        >
            إتمام الطلب
        </button>

    `;

}


function openCart(){

    document
        .getElementById("cartModal")
        .classList.add("open");

    renderCart();

}


function closeCart(){

    document
        .getElementById("cartModal")
        .classList.remove("open");

}


function openCheckout(){

    if(!cart.length){

        return;

    }


    closeCart();


    document
        .getElementById("checkoutModal")
        .classList.add("open");


    const summary =
        cartSummary();


    document.getElementById(
        "checkoutBody"
    ).innerHTML = `

        <div class="form-grid">

            <label class="field">

                <span>
                    الاسم
                </span>

                <input
                    id="cName"
                >

            </label>


            <label class="field">

                <span>
                    الجوال
                </span>

                <input
                    id="cPhone"
                    type="tel"
                >

            </label>


            <label class="field">

                <span>
                    البريد الإلكتروني
                </span>

                <input
                    id="cEmail"
                    type="email"
                >

            </label>


            <label class="field">

                <span>
                    طريقة الاستلام
                </span>

                <select
                    id="fulfillment"
                    onchange="toggleAddress()"
                >

                    <option value="delivery">
                        توصيل داخل مكة
                    </option>

                    <option value="pickup">
                        استلام شخصي
                    </option>

                </select>

            </label>


            <label
                class="field full"
                id="addressField"
            >

                <span>
                    العنوان
                </span>

                <textarea
                    id="cAddress"
                    rows="2"
                    placeholder="عنوانك داخل مكة"
                ></textarea>

            </label>


            <div class="field full">

                <span>
                    طريقة الدفع
                </span>

                <div class="method">

                    <label>

                        <input
                            type="radio"
                            name="pay"
                            value="online"
                            checked
                        >

                        دفع إلكتروني

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="pay"
                            value="cash"
                        >

                        الدفع عند الاستلام / الاستلام

                    </label>

                </div>

            </div>

        </div>


        <div class="totals">

            <div class="row">

                <span>
                    الإجمالي
                </span>

                <b>
                    ${money(summary.total)}
                </b>

            </div>

        </div>


        <div class="notice">

            بعد إتمام الطلب سيظهر لك
            رقم الطلب مباشرة.
            احتفظ به للاستعلام عن طلبك.

        </div>


        <button
            class="primary"
            style="
                width:100%;
                margin-top:14px
            "
            onclick="placeOrder()"
        >
            تأكيد الطلب
        </button>

    `;

}


function toggleAddress(){

    document.getElementById(
        "addressField"
    ).style.display =
        document.getElementById(
            "fulfillment"
        ).value === "delivery"
        ?
        "flex"
        :
        "none";

}


function closeCheckout(){

    document
        .getElementById("checkoutModal")
        .classList.remove("open");

}


function generateOrderNo(){

    return (
        "NEXO-" +
        Math.floor(
            10000000 +
            Math.random() * 90000000
        )
    );

}


function placeOrder(){

    const name =
        document.getElementById(
            "cName"
        ).value.trim();


    const phone =
        document.getElementById(
            "cPhone"
        ).value.trim();


    const email =
        document.getElementById(
            "cEmail"
        ).value.trim();


    const fulfillment =
        document.getElementById(
            "fulfillment"
        ).value;


    const address =
        document.getElementById(
            "cAddress"
        ).value.trim();


    const payment =
        document.querySelector(
            'input[name="pay"]:checked'
        ).value;


    if(
        !name ||
        !phone ||
        !email
    ){

        alert(
            "أكمل الاسم والجوال والبريد الإلكتروني."
        );

        return;

    }


    if(
        fulfillment === "delivery" &&
        !address
    ){

        alert(
            "اكتب عنوان التوصيل داخل مكة."
        );

        return;

    }


    const summary =
        cartSummary();


    const orderNumber =
        generateOrderNo();


    const order = {

        id:Date.now(),

        orderNumber,

        customerName:name,

        phone,

        email,

        address,

        fulfillment,

        paymentMethod:payment,

        items:
            cart.map(item=>{

                const product =
                    products.find(
                        product =>
                            String(product.id)
                            === String(item.id)
                    );


                return {

                    id:product.id,

                    name:product.name,

                    price:
                        Number(product.price),

                    quantity:
                        Number(item.qty),

                    type:
                        product.type,

                    digitalLink:
                        product.digitalLink || ""

                };

            }),

        subtotal:
            summary.subtotal,

        discount:
            summary.discount,

        discountPercent:
            summary.percent,

        delivery:
            summary.delivery,

        total:
            summary.total,

        status:"new",

        createdAt:
            new Date().toISOString()

    };


    const orders =
        JSON.parse(
            localStorage.getItem(
                K.orders
            ) || "[]"
        );


    orders.push(order);


    localStorage.setItem(
        K.orders,
        JSON.stringify(orders)
    );


    cart.forEach(item=>{

        const product =
            products.find(
                product =>
                    String(product.id)
                    === String(item.id)
            );


        if(
            product &&
            product.type === "physical"
        ){

            product.quantity =
                Math.max(
                    0,
                    Number(product.quantity)
                    -
                    Number(item.qty)
                );

        }

    });


    saveProducts();


    cart = [];

    saveCart();

    closeCheckout();

    showOrderSuccess(order);

}


function showOrderSuccess(order){

    const pickup =
        order.fulfillment === "pickup";


    const phone =
        settings.pickupPhone ||
        settings.contact ||
        "";


    const site =
        settings.pickupSite ||
        location.href;


    const modal =
        document.createElement("div");


    modal.className =
        "modal open";


    modal.id =
        "successModal";


    modal.innerHTML = `

        <div
            class="sheet"
            style="text-align:center"
        >

            <div style="font-size:42px">
                ✓
            </div>

            <h2>
                تم استلام طلبك
            </h2>

            <p
                style="color:#6b7280"
            >
                رقم طلبك
            </p>


            <div
                style="
                    font-size:28px;
                    font-weight:800;
                    margin:10px
                "
            >
                ${order.orderNumber}
            </div>


            <div class="notice">

                ⚠️ احفظ رقم الطلب،
                ستحتاجه للاستعلام عن حالة طلبك.

            </div>


            ${
                pickup

                ?

                `
                <div class="notice">

                    اخترت الاستلام الشخصي.

                    <br>

                    رقم التواصل:
                    <b>
                        ${escapeHtml(phone)}
                    </b>

                    <br>

                    الموقع:
                    <b>
                        ${escapeHtml(site)}
                    </b>

                </div>
                `

                :

                ""
            }


            <button
                class="primary"
                style="
                    width:100%;
                    margin-top:12px
                "
                onclick="
                    document
                    .getElementById(
                        'successModal'
                    )
                    .remove();

                    document
                    .getElementById(
                        'trackNumber'
                    )
                    .value =
                    '${order.orderNumber}';

                    document
                    .getElementById(
                        'track'
                    )
                    .scrollIntoView();

                    trackOrder();
                "
            >
                متابعة الطلب
            </button>

        </div>

    `;


    document.body.appendChild(modal);

}


function openTrack(){

    document
        .getElementById("track")
        .scrollIntoView({
            behavior:"smooth"
        });


    setTimeout(()=>{

        document
            .getElementById(
                "trackNumber"
            )
            .focus();

    },500);

}


function trackOrder(){

    const number =
        document
        .getElementById(
            "trackNumber"
        )
        .value
        .trim();


    const orders =
        JSON.parse(
            localStorage.getItem(
                K.orders
            ) || "[]"
        );


    const order =
        orders.find(
            item =>
                String(
                    item.orderNumber
                ).toLowerCase()
                ===
                number.toLowerCase()
        );


    const result =
        document.getElementById(
            "trackResult"
        );


    if(!order){

        result.innerHTML = `

            <div class="status-card">

                لم نجد طلبًا بهذا الرقم.

                <br>

                تأكد من الرقم المحفوظ معك.

            </div>

        `;

        return;

    }


    const status =
        statusMap[
            order.status
        ] ||
        statusMap.new;


    result.innerHTML = `

        <div class="status-card">

            <h3>
                طلب #${order.orderNumber}
            </h3>


            <div class="status-pill">

                ${status[0]}
                ${status[1]}

            </div>


            <p>
                ${status[2]}
            </p>


            <div
                style="
                    color:#6b7280;
                    font-size:13px
                "
            >

                الإجمالي:
                ${money(order.total)}

            </div>


            ${
                order.fulfillment === "pickup"

                ?

                `
                <div class="notice">

                    استلام شخصي —
                    راجع بيانات الاستلام
                    المرسلة لك بعد الطلب.

                </div>
                `

                :

                ""
            }

        </div>

    `;

}


function init(){

    settings =
        JSON.parse(
            localStorage.getItem(
                K.settings
            ) || "{}"
        );


    products =
        JSON.parse(
            localStorage.getItem(
                K.products
            ) || "[]"
        );


    document.getElementById(
        "heroText"
    ).textContent =
        settings.description ||
        "تسوق بسهولة، ادفع بأمان، وتابع طلبك حتى يصل إليك.";


    document.getElementById(
        "footer"
    ).innerHTML =

        `© ${new Date().getFullYear()}
        NEXO STORE
        ${
            settings.contact
            ?
            " — " +
            escapeHtml(settings.contact)
            :
            ""
        }`;


    renderProducts();

    updateCartCount();


    setTimeout(()=>{

        document.getElementById(
            "loader"
        ).style.opacity = "0";


        setTimeout(()=>{

            document
                .getElementById(
                    "loader"
                )
                .remove();

        },500);

    },1900);

}


init();

</script>

</body>
</html>
